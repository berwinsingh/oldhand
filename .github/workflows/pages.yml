name: Deploy Oldhand website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Generate social preview image
        working-directory: site
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/oldhand-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4173/?social-preview=1" > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              cat /tmp/oldhand-preview.log
              exit 1
            fi

            sleep 1
          done

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --window-size=1200,627 \
            --virtual-time-budget=3000 \
            --screenshot="$PWD/dist/client/og-image.png" \
            "http://127.0.0.1:4173/?social-preview=1"

          test -s dist/client/og-image.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
